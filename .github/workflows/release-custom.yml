name: release-custom
on:
  push:
    branches:
      - "v*" # Will trigger if tag is pushed matching pattern `v*`

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: make dist LISTMONK_VERSION=${{ github.ref_name }}
      - run: |
          docker build \
            -t ghcr.io/blu3id/listmonk:${{ github.ref_name }} \
            -t ghcr.io/blu3id/listmonk:${{ github.ref_name }}-$(git rev-parse --short HEAD) \
            .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker push ghcr.io/blu3id/listmonk:${{ github.ref_name }}
      - run: docker push ghcr.io/blu3id/listmonk:${{ github.ref_name }}-$(git rev-parse --short HEAD)